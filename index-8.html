<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const qs=new URLSearchParams(location.search),QT=qs.get('time'),DEMO=qs.has('demo'),DSEC=Math.max(3,parseFloat(qs.get('demo'))||48);
if(qs.has('clean'))document.documentElement.classList.add('clean');
const SYN=29.530588853;
function moonPhase(){const q=parseFloat(qs.get('phase'));if(!isNaN(q))return((q%1)+1)%1;const d=(Date.now()-Date.UTC(2000,0,6,18,14))/864e5;return(((d/SYN)%1)+1)%1}
const MOONP=moonPhase();
const ESB_SCHEMES={white:['255,240,214','255,240,214','255,240,214',null],xmas:['255,70,70','60,200,110','255,70,70','60,200,110'],halloween:['255,140,40','150,90,255','255,140,40','150,90,255'],pride:['255,70,70','255,160,40','90,210,110','90,130,255'],july:['255,70,70','255,255,255','70,120,255','255,70,70'],stpat:['60,200,110','60,200,110','255,255,255','60,200,110'],valentine:['255,70,100','255,120,160','255,70,100','255,120,160']};
function esbScheme(){
  const q=qs.get('lights');if(q&&ESB_SCHEMES[q])return ESB_SCHEMES[q];
  const d=new Date(),m=d.getMonth()+1,day=d.getDate();
  if(m===12&&day<=25)return ESB_SCHEMES.xmas;
  if(m===10&&day>=24)return ESB_SCHEMES.halloween;
  if(m===6&&day>=20)return ESB_SCHEMES.pride;
  if(m===7&&day<=4)return ESB_SCHEMES.july;
  if(m===3&&day>=15&&day<=17)return ESB_SCHEMES.stpat;
  if(m===2&&day>=11&&day<=14)return ESB_SCHEMES.valentine;
  return ESB_SCHEMES.white;
}
const ESBL=esbScheme();
let W,H,D,lay=[],PAD=26,off=[0,0,0],par=0,bloomC,noiseP,planes=[],nextPlane=25,flakes=[],wind=0,tilt=0,T=0,last=0,lastBuild=-1e9,lastClock=-1e9;
let frost,glintC,cityLow,wins=[],chims=[],beacon=null,B=0,Bt=0,SDIR=1,nextStorm=60,stormEnd=0,shoot=[],nextShoot=12,puffs=[],puffAcc=0,dtG=.016,soundOn=false,AC=null,AG,AL,AH,lastSnd=0;

const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const lerp=(a,b,t)=>a+(b-a)*t;
const mixA=(A,B,t)=>A.map((v,i)=>v+(B[i]-v)*t);
const css=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const trip=a=>(a[0]|0)+','+(a[1]|0)+','+(a[2]|0);
const toHex=a=>'#'+a.map(v=>(v|0).toString(16).padStart(2,'0')).join('');

// hour, name, sky[top,mid,low,horizon], shadow tone, snow light, stars, window glow
const KEYS=[
 [0,   'night',     ['#070b26','#0f1a47','#1c2860','#2f3875'],'#070b22',.5, 1,  1],
 [4.5, 'night end', ['#0a1033','#1b2a62','#3d4a88','#7a6a9c'],'#0b1030',.55,.85,.95],
 [6.25,'sunrise',   ['#27427f','#6a7fb4','#e8a78f','#ffd0a0'],'#2b3566',.8, .1, .5],
 [9,   'morning',   ['#3d6ab0','#7fa6d6','#bcd4ee','#e6eef8'],'#4b5f94',.95,0,  .1],
 [11.5,'day',       ['#2f78c4','#69a6df','#a9cdee','#dcebf7'],'#506a9c',1,  0,  0],
 [13.5,'noon',      ['#2a73c9','#5aa0e6','#9cc8f0','#d4e8f8'],'#506a9c',1,  0,  0],
 [16.5,'afternoon', ['#3f72b8','#85a5d0','#d6c0b8','#f2d4b0'],'#4d5a8c',.92,0,  .15],
 [18.5,'dusk',      ['#26356f','#6a5a98','#d98a8a','#ffb88a'],'#2a2f66',.7, .15,.75],
 [20,  'dusk end',  ['#0f1640','#2a2f6e','#6a5a98','#a46f8f'],'#0d1238',.55,.6, 1],
 [22,  'night',     ['#080d2b','#111c4b','#1f2b63','#33397a'],'#070b22',.5, 1,  1],
 [24,  'night',     ['#070b26','#0f1a47','#1c2860','#2f3875'],'#070b22',.5, 1,  1]
].map(k=>({h:k[0],n:k[1],sky:k[2].map(hx),dark:hx(k[3]),light:k[4],stars:k[5],win:k[6]}));
const LABELS=[[0,'night'],[4.5,'night end'],[6.25,'morning'],[10,'day'],[12.5,'noon'],[15,'afternoon'],[18.5,'dusk'],[20.5,'night']];

function stateAt(h){
  let i=0;while(i<KEYS.length-2&&h>=KEYS[i+1].h)i++;
  const a=KEYS[i],b=KEYS[i+1];let t=(h-a.h)/(b.h-a.h);t=t*t*(3-2*t);
  return{sky:a.sky.map((c,j)=>mixA(c,b.sky[j],t)),dark:mixA(a.dark,b.dark,t),
    light:lerp(a.light,b.light,t),stars:lerp(a.stars,b.stars,t),win:lerp(a.win,b.win,t)};
}
function hourNow(){
  if(DEMO)return(T*24/DSEC)%24;
  if(QT&&/^\d{1,2}:\d{2}$/.test(QT)){const p=QT.split(':');return(+p[0]%24)+ +p[1]/60}
  const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
}
function labelAt(h){let l=LABELS[0][1];for(const e of LABELS)if(h>=e[0])l=e[1];return l}

const sprite=(()=>{
  const s=document.createElement('canvas');s.width=s.height=32;
  const g=s.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.45,'rgba(255,255,255,.75)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,32,32);return s;
})();

const stars=(()=>{const R=rng(5),a=[];for(let i=0;i<150;i++){const y=R()*.5;a.push({x:R(),y,s:R()*1.3+.4,a:.2+.8*R()*(1-y/.5),ph:R()*6.28,sp:.6+R()*1.6,b:0})}return a})();

function build(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);
  lay=[0,1,2].map(()=>{const c=document.createElement('canvas');c.width=Math.round((W+2*PAD)*D);c.height=cv.height;return c});
  bloomC=document.createElement('canvas');bloomC.width=Math.ceil(W/8);bloomC.height=Math.ceil(H/8);bloomC.getContext('2d').imageSmoothingQuality='high';
  makeGrain();
  lastBuild=-1e9;
  makeFrost();
  glintC=document.createElement('canvas');glintC.width=Math.ceil(W/3);glintC.height=Math.ceil(H/3);
  cityLow=document.createElement('canvas');cityLow.width=glintC.width;cityLow.height=glintC.height;
}

function capFlat(g,x,y,w,s,cap){g.fillStyle=cap;g.fillRect(x-s,y-1.6*s,w+2*s,2.8*s)}

function buildCity(S){
  let g,curL=0;
  wins=[];chims=[];beacon=null;
  const R=rng(11),hor=S.sky[3],u=Math.min(W,H*.56);
  const cap=css(mixA([150,168,224],[255,255,255],S.light));
  const wrgb=trip(mixA([255,255,255],[25,40,90],S.light));
  const layers=[
    {base:.72,hMin:.07,hMax:.20,wMin:.07,wMax:.14,k:.3, sc:.6, lit:.10,glow:.5,fog:.30},
    {base:.80,hMin:.10,hMax:.26,wMin:.08,wMax:.16,k:.6, sc:.85,lit:.20,glow:.8,fog:.22},
    {base:.88,hMin:.12,hMax:.30,wMin:.09,wMax:.18,k:.88,sc:1.15,lit:.30,glow:1,fog:0}
  ];

  // --- helpers ---
  const sheen=(x,y,w,h)=>{const sg=g.createLinearGradient(x,0,x+w,0);sg.addColorStop(0,'rgba(255,255,255,'+(.04+.06*S.light)+')');sg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sg;g.fillRect(x,y,w,h)};
  const ln=(L,x,y0,w,y1)=>{const gy=9.4*L.sc;g.strokeStyle='rgba('+wrgb+','+(.05+.05*S.light)+')';g.lineWidth=.6;g.beginPath();for(let wy=y0+gy;wy<y1;wy+=gy){g.moveTo(x,wy);g.lineTo(x+w,wy)}g.stroke()};
  const win=(L,col,x,y0,w,y1)=>{
    const ws=2.6*L.sc,wh=4.3*L.sc,gx=6.2*L.sc,gy=9.4*L.sc,thr=L.lit*S.win;
    for(let wy=y0+gy*.5;wy<y1-gy*.35;wy+=gy)for(let wx=x+gx*.5;wx<x+w-ws-1;wx+=gx){
      const r=R(),r2=R(),r3=R();
      if(r<thr){
        const a=(.55+.4*r3)*L.glow;
        g.fillStyle=r2<.15?'rgba(175,215,255,'+a+')':'rgba(255,'+(185+r2*35|0)+','+(90+r2*40|0)+','+a+')';
        g.fillRect(wx,wy,ws,wh);
        if(L.sc>.8&&S.win>.1&&wins.length<60){if(r3>.93)wins.push([wx,wy,ws,wh,col,1,curL]);else if(r3<.05)wins.push([wx,wy,ws,wh,col,2,curL])}
      }
    }
  };
  const fire=(L,x,y0,w,y1)=>{
    const gy=9.4*L.sc,fx=x+w*.6,fw=w*.3;let flip=0;
    g.strokeStyle='rgba(8,12,34,'+(.6-.25*S.light)+')';g.lineWidth=.7*L.sc;g.beginPath();
    for(let wy=y0+gy*2;wy<y1-gy;wy+=gy*2){
      g.moveTo(fx,wy);g.lineTo(fx+fw,wy);
      g.moveTo(flip?fx:fx+fw,wy);g.lineTo(flip?fx+fw:fx,wy+gy*2);flip^=1;
    }
    g.stroke();
  };
  const tank=(L,cx,ty)=>{
    const s=L.sc,tw=6*s,th=6.5*s,leg=3.2*s;
    const wood=css(mixA(mixA(hor,[95,66,48],.55+.4*L.k),S.dark,.15));
    g.strokeStyle=css(mixA(hor,S.dark,L.k));g.lineWidth=.7*s;g.beginPath();
    [-1,-.35,.35,1].forEach(f=>{g.moveTo(cx+f*tw/2,ty);g.lineTo(cx+f*tw/2,ty-leg)});g.stroke();
    g.fillStyle=wood;g.fillRect(cx-tw/2,ty-leg-th,tw,th);
    g.beginPath();g.moveTo(cx-tw/2-.6*s,ty-leg-th);g.lineTo(cx,ty-leg-th-4*s);g.lineTo(cx+tw/2+.6*s,ty-leg-th);g.closePath();g.fill();
    g.fillStyle=cap;g.beginPath();g.moveTo(cx-tw*.28,ty-leg-th-2.2*s);g.lineTo(cx,ty-leg-th-4.2*s);g.lineTo(cx+tw*.28,ty-leg-th-2.2*s);g.closePath();g.fill();
    g.strokeStyle='rgba(20,14,12,.4)';g.lineWidth=.5*s;g.beginPath();
    g.moveTo(cx-tw/2,ty-leg-th*.7);g.lineTo(cx+tw/2,ty-leg-th*.7);g.moveTo(cx-tw/2,ty-leg-th*.3);g.lineTo(cx+tw/2,ty-leg-th*.3);g.stroke();
  };
  const stack=(L,cx,ty)=>{
    const s=L.sc,sw=2.4*s,sh=9*s,x0=cx-sw/2;
    const o=css(mixA(mixA(hor,[235,120,50],.7),S.dark,.1+.6*(1-S.light))),w=css(mixA(hor,[245,245,250],.6+.2*L.k));
    for(let i=0;i<3;i++){g.fillStyle=i%2?w:o;g.fillRect(x0,ty-sh+i*sh/3,sw,sh/3+.3)}
    g.fillStyle=cap;g.fillRect(x0-.3*s,ty-sh-.8*s,sw+.6*s,1.4*s);
    chims.push([cx,ty-sh-2*s,s,curL]);
  };

  // generic prewar / deco / slab buildings
  const bld=(L,col,x,bw,bh,by,v,rs)=>{
    const top=by-bh,s=L.sc;
    g.fillStyle=col;
    if(v<.38){
      g.fillRect(x,top,bw+1,bh+H);g.fillRect(x-1.2*s,top-.5*s,bw+2.4*s,2.4*s);
      capFlat(g,x-1.2*s,top-.5*s,bw+2.4*s,s*.8,cap);
      sheen(x,top,bw,bh);ln(L,x,top,bw,by);win(L,col,x,top,bw,by);
      if(s>.8&&rs>.25&&rs<.62)fire(L,x,top,bw,by);
      if(rs>.62)tank(L,x+bw*(.2+(rs-.62)*1.6),top-.5*s);
      else if(rs<.2&&s>.8)stack(L,x+bw*.78,top-.5*s);
    }else if(v<.7){
      const cx=x+bw/2,w=[bw,bw*.72,bw*.5],t0=by-bh*.55,t1=by-bh*.82;
      g.fillRect(x,t0,w[0]+1,by-t0+H);g.fillRect(cx-w[1]/2,t1,w[1],t0-t1+1);g.fillRect(cx-w[2]/2,top,w[2],t1-top+1);
      capFlat(g,x,t0,w[0],s,cap);capFlat(g,cx-w[1]/2,t1,w[1],s,cap);capFlat(g,cx-w[2]/2,top,w[2],s,cap);
      g.fillStyle=col;g.beginPath();g.moveTo(cx-w[2]*.12,top);g.lineTo(cx,top-bh*.13-4*s);g.lineTo(cx+w[2]*.12,top);g.fill();
      sheen(x,t0,bw,by-t0);
      ln(L,x,t0,w[0],by);win(L,col,x,t0,w[0],by);
      ln(L,cx-w[1]/2,t1,w[1],t0);win(L,col,cx-w[1]/2,t1,w[1],t0);
      ln(L,cx-w[2]/2,top,w[2],t1);win(L,col,cx-w[2]/2,top,w[2],t1);
    }else{
      g.fillRect(x,top,bw+1,bh+H);capFlat(g,x,top,bw,s,cap);
      g.fillStyle=col;g.fillRect(x+bw*.3,top-3.5*s,bw*.35,3.8*s);capFlat(g,x+bw*.3,top-3.5*s,bw*.35,s*.7,cap);
      if(rs>.5){g.fillStyle=col;g.fillRect(x+bw*.8,top-bh*.12,1.3*s,bh*.12)}
      sheen(x,top,bw,bh);ln(L,x,top,bw,by);win(L,col,x,top,bw,by);
      if(rs<.25&&s>.8)stack(L,x+bw*.15,top);
    }

function aurora(S){

  ctx.save();ctx.globalCompositeOperation='lighter';
  const rb=[['70,255,180',.10,.22,.9],['90,200,255',.16,.3,.7],['170,120,255',.13,.34,.55]];
  rb.forEach((r,i)=>{
    const y0=H*r[1],hh=H*r[2],wave=k=>Math.sin(k*.45+T*.25*(1+i*.3)+i*2)*H*.035+Math.sin(k*.18-T*.15+i)*H*.03;
    const g=ctx.createLinearGradient(0,y0-hh*.2,0,y0+hh);
    g.addColorStop(0,'rgba('+r[0]+',0)');g.addColorStop(.3,'rgba('+r[0]+','+.16*A*r[3]+')');g.addColorStop(1,'rgba('+r[0]+',0)');
    ctx.fillStyle=g;ctx.beginPath();
    const n=28;
    for(let k=0;k<=n;k++){const x=W*k/n,y=y0+wave(k);k?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    for(let k=n;k>=0;k--)ctx.lineTo(W*k/n,y0+hh*(.7+.3*Math.sin(k*.7+T*.4+i))+wave(k));
    ctx.closePath();ctx.fill();
  });

}

function makeFrost(){
  frost=document.createElement('canvas');frost.width=cv.width;frost.height=cv.height;
  const g=frost.getContext('2d');g.scale(D,D);
  const R=rng(23),e=Math.min(W,H)*.1;
  const edge=(x0,y0,x1,y1,rx,ry,rw,rh)=>{const l=g.createLinearGradient(x0,y0,x1,y1);l.addColorStop(0,'rgba(225,240,255,.26)');l.addColorStop(1,'rgba(225,240,255,0)');g.fillStyle=l;g.fillRect(rx,ry,rw,rh)};
  edge(0,0,0,e,0,0,W,e);edge(0,H,0,H-e,0,H-e,W,e);edge(0,0,e,0,0,0,e,H);edge(W,0,W-e,0,W-e,0,e,H);
  [[0,0],[W,0],[0,H],[W,H]].forEach(c=>{
    const r=g.createRadialGradient(c[0],c[1],0,c[0],c[1],e*2.4);
    r.addColorStop(0,'rgba(235,246,255,.34)');r.addColorStop(1,'rgba(235,246,255,0)');
    g.fillStyle=r;g.fillRect(c[0]-e*2.4,c[1]-e*2.4,e*4.8,e*4.8);
  });
  g.strokeStyle='#ebf6ff';g.lineWidth=.7;g.lineCap='round';
  const branch=(x,y,a,L,d)=>{
    const nx=x+Math.cos(a)*L,ny=y+Math.sin(a)*L;
    g.beginPath();g.moveTo(x,y);g.lineTo(nx,ny);g.stroke();
    if(d>0){const mx=x+(nx-x)*.55,my=y+(ny-y)*.55;branch(mx,my,a+.9,L*.5,d-1);branch(mx,my,a-.9,L*.5,d-1);branch(nx,ny,a+(R()-.5)*.5,L*.6,d-1)}
  };
  const N=Math.round((W+H)*.5);
  for(let i=0;i<N;i++){
    const side=R()*4|0,t=R(),d=R()*R()*e*.9;let x,y,a;
    if(side===0){x=t*W;y=d;a=Math.PI/2}else if(side===1){x=t*W;y=H-d;a=-Math.PI/2}else if(side===2){x=d;y=t*H;a=0}else{x=W-d;y=t*H;a=Math.PI}
    g.globalAlpha=.25+.5*R();branch(x,y,a+(R()-.5)*1.6,6+R()*20,2);
  }
}

function glint(h){

  g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.clearRect(0,0,gw,gh);

}

function steam(S){
  if(chims.length&&!RM){
    puffAcc+=dtG*(2.2+B*1.5);
    while(puffAcc>1&&puffs.length<80){
      puffAcc--;const c=chims[(Math.random()*chims.length)|0];
      puffs.push({x:c[0],y:c[1],li:c[3],vx:(Math.random()-.5)*4,l:0,m:3.2+Math.random()*2,r:c[2]*(2+Math.random()*2)});
    }
  }
  for(let i=puffs.length-1;i>=0;i--){
    const p=puffs[i];p.l+=dtG;if(p.l>p.m){puffs.splice(i,1);continue}
    const k=p.l/p.m;
    p.x+=(p.vx+(wind+tilt)*.04)*dtG;p.y-=(10+8*(1-k))*dtG;

}

// ambient sound (off until the speaker is tapped)
function sound(on){
  if(on&&!AC){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();
    const mk=brown=>{const b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=b.getChannelData(0);let l=0;
      for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b};
    const s1=AC.createBufferSource();s1.buffer=mk(true);s1.loop=true;
    AL=AC.createBiquadFilter();AL.type='lowpass';AL.frequency.value=450;
    AG=AC.createGain();AG.gain.value=0;s1.connect(AL);AL.connect(AG);AG.connect(AC.destination);s1.start();
    const s2=AC.createBufferSource();s2.buffer=mk(false);s2.loop=true;
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=5200;
    AH=AC.createGain();AH.gain.value=0;s2.connect(hp);hp.connect(AH);AH.connect(AC.destination);s2.start();
  }
  if(!AC)return;
  AC.resume();
  if(!on){const t=AC.currentTime;AG.gain.setTargetAtTime(0,t,.3);AH.gain.setTargetAtTime(0,t,.3)}
}

}

  ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,Math.PI/2,!waxing);
  ctx.ellipse(x,y,Math.abs(c)*r,r,0,Math.PI/2,-Math.PI/2,waxing?c>0:c<=0);

    const t=(T+p.ph)%1.5,strobe=(t<.07||(t>.2&&t<.27)),bc=Math.pow(Math.max(0,Math.sin((T+p.ph)*4.2)),8),al=Math.min(1,S.stars*1.2);
    ctx.globalAlpha=al*.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,.7,0,7);ctx.fill();
    ctx.globalAlpha=al*(.12+.5*bc);ctx.fillStyle='#ff4a3c';ctx.beginPath();ctx.arc(p.x,p.y,1.1,0,7);ctx.fill();
    if(strobe){
      ctx.globalAlpha=al*.22;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();
      ctx.globalAlpha=al*.95;ctx.beginPath();ctx.arc(p.x,p.y,1.3,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

const FOGS=[[.72,.30],[.80,.22]];
function drawCity(S){
  const hc=trip(S.sky[3]);
  for(let i=0;i<3;i++){
    ctx.drawImage(lay[i],-PAD+off[i],0,W+2*PAD,H);
    if(i<2){
      const by=H*FOGS[i][0],f=ctx.createLinearGradient(0,by-H*.28,0,by+H*.02);
      f.addColorStop(0,'rgba('+hc+',0)');f.addColorStop(1,'rgba('+hc+','+FOGS[i][1]+')');
      ctx.fillStyle=f;ctx.fillRect(0,by-H*.28,W,H*.3);
    }
  }
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.8);
  vg.addColorStop(0,'rgba(5,8,30,0)');vg.addColorStop(1,'rgba(5,8,30,'+(.1+.25*(1-S.light))+')');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function makeGrain(){
  const c=document.createElement('canvas');c.width=c.height=160;
  const g=c.getContext('2d'),im=g.createImageData(160,160);
  for(let i=0;i<im.data.length;i+=4){const v=128+(Math.random()+Math.random()-1)*110|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
  g.putImageData(im,0,0);noiseP=ctx.createPattern(c,'repeat');
}

function orb(x,y,r,col,ga,gr){
  const g=ctx.createRadialGradient(x,y,r*.6,x,y,r*gr);
  g.addColorStop(0,'rgba('+col+','+ga+')');g.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle=g;ctx.fillRect(x-r*gr,y-r*gr,r*gr*2,r*gr*2);
  ctx.fillStyle='rgb('+col+')';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
}

function drawSky(S,h){
  const sk=ctx.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,css(S.sky[0]));sk.addColorStop(.42,css(S.sky[1]));sk.addColorStop(.74,css(S.sky[2]));sk.addColorStop(1,css(S.sky[3]));
  ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);
  // stars
  if(S.stars>.02){
    ctx.fillStyle='#fff';
    for(const s of stars){
      s.b=Math.max(0,s.b-dtG*.7);
      ctx.globalAlpha=Math.min(1,Math.max(0,s.a*S.stars*(.65+.35*Math.sin(T*s.sp+s.ph))+s.b));
      const z=s.s*(1+s.b*2.5),sx=s.x*W,sy=s.y*H;
      ctx.fillRect(sx,sy,z,z);
      if(s.b>.05){ctx.fillRect(sx-z*3*s.b,sy+z*.4,z*(1+6*s.b),Math.max(.6,z*.25));ctx.fillRect(sx+z*.4,sy-z*3*s.b,Math.max(.6,z*.25),z*(1+6*s.b))}
    }
    ctx.globalAlpha=1;
  }
  aurora(S);shootStars(S);aircraft(S);
  const hz=H*.64,arc=H*.5,m=Math.min(W,H);
  // sun: 06:00 to 18:45
  const ts=(h-6)/12.75;
  if(ts>-.08&&ts<1.08){
    const e=Math.max(0,Math.sin(Math.PI*ts));
    const col=trip(mixA([255,140,80],[255,246,214],Math.min(1,e*3)));
    orb(W*(.1+.8*ts),hz-Math.sin(Math.PI*ts)*arc,m*.058*(1+.25*(1-e)),col,.45,7);
  }
  // moon: 18:00 to 06:00
  const mh=h<12?h+24:h,tm=(mh-18)/12;
  if(tm>-.08&&tm<1.08){
    const mx=W*(.1+.8*tm),my=hz-Math.sin(Math.PI*tm)*arc,mr=m*.065;
    moon(mx,my,mr,Math.max(0,Math.min(1,S.stars*1.3+.2)));
  }
}

function mk(init){
  const z=Math.random();
  return{z,x:Math.random()*W,y:init?Math.random()*H:-12,r:(1+z*z*4.2)*1.3,vy:16+z*58+Math.random()*10,
    sw:5+Math.random()*14,ph:Math.random()*6.28,vx:0,ix:0,iy:0};
}
function seed(){
  const n=Math.min(320,Math.round(W*H/5000));
  flakes=[];for(let i=0,m=Math.round(n*1.9);i<m;i++)flakes.push(mk(true));
}

// input
let px=null,py=null;
function push(x,y,dx,dy){
  const R=90;
  for(const f of flakes){
    const ex=f.x-x,ey=f.y-y,d=Math.hypot(ex,ey);
    if(d<R){const k=(1-d/R)*(.4+f.z*.8);f.ix+=dx*k*7+ex/(d+1)*k*50;f.iy+=dy*k*7+ey/(d+1)*k*50}
  }
}
function burst(x,y){
  const R=170;
  for(const f of flakes){
    const ex=f.x-x,ey=f.y-y,d=Math.hypot(ex,ey);
    if(d<R){const k=(1-d/R)*(.5+f.z*.7);f.ix+=ex/(d+1)*k*520;f.iy+=ey/(d+1)*k*520-60*k}
  }
}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);px=e.clientX;py=e.clientY;if(!RM)burst(px,py);twinkle(px,py)});
cv.addEventListener('pointermove',e=>{
  if(px===null)return;
  const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  wind=Math.max(-260,Math.min(260,wind+dx*4));
  if(!RM)push(px,py,dx,dy);
});
const up=()=>{px=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=Math.max(-60,Math.min(60,e.gamma))*3});

const elTime=document.getElementById('time'),elState=document.getElementById('state'),meta=document.querySelector('meta[name=theme-color]');
function clock(h,S){
  let txt;
  if(DEMO||QT){const hh=Math.floor(h)%24,mm=Math.floor((h%1)*60);txt=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
  else txt=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  elTime.textContent=txt;elState.textContent=labelAt(h);
  meta.content=toHex(S.sky[0]);
}

function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0.016);last=ts;T+=dt;
  const h=hourNow(),S=stateAt(h);
  if(ts-lastBuild>(DEMO?(DSEC<20?200:450):30000)){buildCity(S);lastBuild=ts}
  if(ts-lastClock>(DEMO?200:1000)){clock(h,S);lastClock=ts}
  ctx.setTransform(D,0,0,D,0,0);ctx.globalAlpha=1;
  dtG=dt;weather();
  drawSky(S,h);
  const tn=RM?0:Math.max(-1,Math.min(1,px!==null?(px-W/2)/(W/2):tilt/180+Math.sin(T*.11)*.12));
  par+=(tn-par)*Math.min(1,dt*2.5);off[0]=-par*5;off[1]=-par*11;off[2]=-par*20;
  drawCity(S);
  winLife(S);glint(h);steam(S);
  if(B>.02){const vg=ctx.createLinearGradient(0,0,0,H),vc=trip(mixA(S.sky[2],[240,245,255],.55));
    vg.addColorStop(0,'rgba('+vc+','+.1*B+')');vg.addColorStop(1,'rgba('+vc+','+.3*B+')');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
  const sp=RM?.35:1,w=wind+tilt+Math.sin(T*.3)*14+B*SDIR*210,damp=Math.exp(-dt*2.6);
  wind*=Math.exp(-dt*.7);
  const act=Math.round(flakes.length/1.9*(1+.9*B));
  for(let fi=0;fi<act;fi++){
    const f=flakes[fi];
    f.vx+=(w*(.35+f.z*.9)-f.vx)*Math.min(1,dt*1.6);
    f.ix*=damp;f.iy*=damp;
    f.x+=(f.vx+Math.sin(T*.9+f.ph)*f.sw)*dt*sp+f.ix*dt;
    f.y+=(f.vy*sp*(1+B*.9)+f.iy)*dt;
    if(f.y>H+12){f.y=-12;f.x=Math.random()*W;f.ix=f.iy=0}
    if(f.x<-20)f.x=W+20;else if(f.x>W+20)f.x=-20;
    const s=f.r*2.6;
    ctx.globalAlpha=.3+.7*f.z;
    ctx.drawImage(sprite,f.x-s/2,f.y-s/2,s,s);
  }
  const fk=Math.max(0,Math.min(1,(.85-S.light)/.35))*(.85+.15*Math.sin(T*.4));
  if(fk>.02){ctx.globalAlpha=fk;ctx.drawImage(frost,0,0,W,H);ctx.globalAlpha=1}
  const bk=Math.max(0,Math.min(1,(.9-S.light)/.4));
  if(bk>.02){
    bloomC.getContext('2d').drawImage(cv,0,0,bloomC.width,bloomC.height);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.22*bk;ctx.drawImage(bloomC,0,0,W,H);ctx.restore();
  }
  if(noiseP){
    const gx=RM?0:(Math.random()*160|0),gy=RM?0:(Math.random()*160|0);
    ctx.save();ctx.setTransform(1,0,0,1,-gx,-gy);ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.07;
    ctx.fillStyle=noiseP;ctx.fillRect(gx,gy,cv.width,cv.height);ctx.restore();
  }
  soundTick();
  requestAnimationFrame(frame);
}

let rt;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{build();seed()},150)});
build();seed();requestAnimationFrame(frame);
</script>
</body>
